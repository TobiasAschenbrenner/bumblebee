name: Build Bumblebee firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned camera, recovery, and acro firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out Bumblebee build inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bumblebee

      - name: Check out ESP32 UDP firmware
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: larics/aideck-esp-firmware-udp
          ref: 2b7152366048bbfa98eea343f68264c52ba0bd0d
          path: esp32

      - name: Require a UDP client handshake before streaming
        run: >-
          git -C esp32 apply
          "$GITHUB_WORKSPACE/bumblebee/firmware/patches/aideck-esp-udp-client-handshake.patch"

      - name: Build ESP32 application
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/esp32:/module"
          bitcraze/builder:40@sha256:d2aa8f9327049d1b3c184f3aa33b81432f2cd07986a3b193b2de26dcf7387112
          bash -c
          "source /new_home/.espressif/python_env/idf4.3_py3.10_env/bin/activate && ./tools/build/build"

      - name: Check out GAP8 UDP streamer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: larics/aideck-gap8-examples
          ref: 124729b2a9f98809c5caed841a29701aab3221fb
          path: gap8

      - name: Build GAP8 streamer without Wi-Fi reconfiguration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/gap8:/module"
          bitcraze/aideck:4.22.0.1@sha256:038197df9cb86ccf8e6649e93dd0cf23781830e136288523983768918851633e
          tools/build/make-example examples/other/wifi-img-streamer build image

      - name: Check out Crazyflie access-point firmware
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bitcraze/crazyflie-firmware
          ref: 16c5630707e92830dcd16455a57b5560e5838735
          path: crazyflie
          submodules: recursive

      - name: Add Bumblebee's time-limited acro permit and flip app
        run: |
          git -C crazyflie apply "$GITHUB_WORKSPACE/bumblebee/firmware/patches/crazyflie-acro-permit.patch"
          cp -R bumblebee/firmware/crazyflie/bumblebee_acro crazyflie/examples/bumblebee_acro

      - name: Build Crazyflie recovery and access-point firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/crazyflie:/module" \
            bitcraze/builder:40@sha256:d2aa8f9327049d1b3c184f3aa33b81432f2cd07986a3b193b2de26dcf7387112 \
            bash -c '
              make cf2_defconfig &&
              sed -i "/CONFIG_DECK_AI_WIFI_/d" build/.config &&
              sed -i "/CONFIG_DECK_AI_SSID=/d; /CONFIG_DECK_AI_PASSWORD=/d" build/.config &&
              printf "%s\n" \
                "CONFIG_DECK_AI_WIFI_NO_SETUP=y" >> build/.config &&
              make olddefconfig &&
              make -j2 &&
              cp build/cf2.bin cf2-2025.02-aideck-recovery.bin &&
              sed -i "/CONFIG_DECK_AI_WIFI_/d" build/.config &&
              sed -i "/CONFIG_DECK_AI_SSID=/d; /CONFIG_DECK_AI_PASSWORD=/d" build/.config &&
              printf "%s\n" \
                "# CONFIG_DECK_AI_WIFI_NO_SETUP is not set" \
                "CONFIG_DECK_AI_WIFI_SETUP_AP=y" \
                "CONFIG_DECK_AI_SSID=\"Bumblebee\"" \
                "CONFIG_DECK_AI_PASSWORD=\"\"" >> build/.config &&
              make olddefconfig &&
              make -j2 &&
              cp build/cf2.bin cf2-2025.02-aideck-ap.bin
            '

      - name: Build Bumblebee acro firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/crazyflie:/module" \
            bitcraze/builder:40@sha256:d2aa8f9327049d1b3c184f3aa33b81432f2cd07986a3b193b2de26dcf7387112 \
            bash -c '
              printf "%s\n" \
                "# CONFIG_DECK_AI_WIFI_NO_SETUP is not set" \
                "CONFIG_DECK_AI_WIFI_SETUP_AP=y" \
                "CONFIG_DECK_AI_SSID=\"Bumblebee\"" \
                "CONFIG_DECK_AI_PASSWORD=\"\"" >> examples/bumblebee_acro/app-config &&
              make -C examples/bumblebee_acro cf2_defconfig &&
              make -C examples/bumblebee_acro -j2 &&
              cp examples/bumblebee_acro/build/cf2.bin cf2-2025.02-bumblebee-acro-aideck-ap.bin
            '

      - name: Collect firmware and checksums
        run: |
          mkdir -p dist
          cp esp32/build/aideck_esp.bin dist/aideck_esp_udp.bin
          cp gap8/examples/other/wifi-img-streamer/BUILD/GAP8_V2/GCC_RISCV_FREERTOS/target.board.devices.flash.img dist/aideck_gap8_udp_streamer.bin
          cp crazyflie/cf2-2025.02-aideck-recovery.bin dist/cf2-2025.02-aideck-recovery.bin
          cp crazyflie/cf2-2025.02-aideck-ap.bin dist/cf2-2025.02-aideck-ap.bin
          cp crazyflie/cf2-2025.02-bumblebee-acro-aideck-ap.bin dist/cf2-2025.02-bumblebee-acro-aideck-ap.bin
          cd dist
          sha256sum *.bin > SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bumblebee-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 7
