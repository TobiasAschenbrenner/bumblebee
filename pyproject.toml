[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bumblebee"
version = "0.1.0"
description = "A friendly terminal companion for the Bitcraze Crazyflie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cflib==0.1.34",
    "opencv-python>=4.10.0",
    "rich>=15.0.0",
]

[project.scripts]
bumblebee-battery = "bumblebee.commands.battery:cli"
bumblebee-camera = "bumblebee.commands.camera:cli"
bumblebee-diagnose = "bumblebee.commands.diagnose:cli"
bumblebee-fly = "bumblebee.commands.fly:cli"
bumblebee-hover = "bumblebee.commands.fly:hover_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bumblebee"]
